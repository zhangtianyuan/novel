<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>风水师陈坨 - 在线小说</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", "Microsoft YaHei", serif;
            background: #f5f0e8;
            color: #3a3a3a;
            line-height: 1.9;
            font-size: 17px;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
            color: #2c2c2c;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 40px;
        }
        .chapter-nav {
            position: sticky;
            top: 0;
            background: #f5f0e8;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .chapter-nav select {
            padding: 6px 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            font-family: inherit;
            max-width: 280px;
        }
        .chapter-nav button {
            padding: 6px 16px;
            font-size: 14px;
            border: 1px solid #aaa;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
        }
        .chapter-nav button:hover {
            background: #e8e0d0;
        }
        .chapter-content {
            min-height: 60vh;
        }
        .chapter-content h2 {
            font-size: 22px;
            text-align: center;
            margin: 30px 0 20px;
            font-weight: 700;
        }
        .chapter-content p {
            text-indent: 2em;
            margin-bottom: 12px;
        }
        .chapter-content hr {
            border: none;
            border-top: 1px dashed #ccc;
            margin: 30px 0;
        }
        .chapter-content blockquote {
            border-left: 3px solid #c0a070;
            padding-left: 16px;
            margin: 16px 0;
            color: #666;
            font-style: italic;
        }
        .loading {
            text-align: center;
            color: #999;
            padding: 60px 0;
        }
        .error-msg {
            text-align: center;
            color: #c00;
            padding: 40px 0;
        }
        .last-updated {
            text-align: center;
            color: #aaa;
            font-size: 12px;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>风水师陈坨</h1>
    <p class="subtitle">一块罗盘走街串巷，一枚铜钱剑降妖镇煞</p>

    <div class="chapter-nav">
        <button id="prevBtn" onclick="prevChapter()">← 上一章</button>
        <select id="chapterSelect" onchange="goToChapter()">
            <option value="">选择章节...</option>
        </select>
        <button id="nextBtn" onclick="nextChapter()">下一章 →</button>
    </div>

    <div class="chapter-content" id="chapterContent">
        <div class="loading">加载中...</div>
    </div>

    <div class="last-updated" id="lastUpdated"></div>
</div>

<script>
    let chapters = [];
    let currentIndex = -1;

    // 使用 jsdelivr CDN 加速国内访问
    const RAW_URL = 'https://cdn.jsdelivr.net/gh/zhangtianyuan/novel@master/正文.md';

    async function fetchChapters() {
        try {
            const resp = await fetch(RAW_URL + '?t=' + Date.now());
            const text = await resp.text();
            const parts = text.split(/(?=## 第)/);
            chapters = parts.map(function(p, i) {
                var title = p.match(/## (.+)/);
                return {
                    title: title ? title[1] : '标题',
                    content: p.trim()
                };
            }).filter(function(c) { return c.content; });

            var sel = document.getElementById('chapterSelect');
            sel.innerHTML = '<option value="">选择章节...</option>';
            chapters.forEach(function(c, i) {
                var opt = document.createElement('option');
                opt.value = i;
                opt.textContent = c.title;
                sel.appendChild(opt);
            });
            var saved = localStorage.getItem('lastChapter');
            if (saved && chapters[+saved]) {
                showChapter(+saved);
            } else if (chapters.length > 0) {
                showChapter(chapters.length - 1);
            }
        } catch (e) {
            document.getElementById('chapterContent').innerHTML =
                '<div class="error-msg">加载失败。可能是网络问题，请尝试以下方法：<br><br>' +
                '1. 刷新页面重试<br>' +
                '2. 或者直接访问 GitHub 仓库查看原文件：<br>' +
                '<a href="https://github.com/zhangtianyuan/novel/blob/master/正文.md" target="_blank">' +
                'https://github.com/zhangtianyuan/novel</a></div>';
        }
    }

    function renderMarkdown(text) {
        var html = '';
        var lines = text.split('\n');
        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line) continue;
            if (line.startsWith('## ')) {
                html += '<h2>' + line.replace('## ', '') + '</h2>';
            } else if (line.startsWith('> ')) {
                html += '<blockquote>' + line.replace('> ', '') + '</blockquote>';
            } else if (line === '---') {
                html += '<hr>';
            } else if (line.startsWith('**') && line.endsWith('**')) {
                html += '<p><strong>' + line.replace(/\*\*/g, '') + '</strong></p>';
            } else {
                var processed = line.replace(/"/g, '\u201c').replace(/"/g, '\u201d');
                html += '<p>' + processed + '</p>';
            }
        }
        return html;
    }

    function showChapter(index) {
        if (index < 0 || index >= chapters.length) return;
        currentIndex = index;
        var c = chapters[index];
        var html = renderMarkdown(c.content);
        document.getElementById('chapterContent').innerHTML = html;
        document.getElementById('chapterSelect').value = index;
        try { localStorage.setItem('lastChapter', index); } catch(e) {}
        document.title = '\u98ce\u6c34\u5e08\u9648\u575f - ' + c.title;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        document.getElementById('lastUpdated').textContent =
            '\u6700\u540e\u66f4\u65b0\uff1a' + new Date().toLocaleString('zh-CN');
    }

    function goToChapter() {
        var val = document.getElementById('chapterSelect').value;
        if (val !== '') showChapter(parseInt(val));
    }

    function nextChapter() {
        if (currentIndex < chapters.length - 1) showChapter(currentIndex + 1);
    }

    function prevChapter() {
        if (currentIndex > 0) showChapter(currentIndex - 1);
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextChapter(); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); prevChapter(); }
    });

    fetchChapters();
</script>
</body>
</html>
